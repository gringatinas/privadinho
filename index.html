<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acesso</title>

<!-- Meta Pixel -->
<script>
!function(f,b,e,v,n,t,s)
{if(f.fbq)return;n=f.fbq=function(){n.callMethod?
n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
n.queue=[];t=b.createElement(e);t.async=!0;
t.src=v;s=b.getElementsByTagName(e)[0];
s.parentNode.insertBefore(t,s)}(window, document,'script',
'https://connect.facebook.net/en_US/fbevents.js');

fbq('init', '800612109674856');
fbq('track', 'PageView');
</script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0a0a0a;
  color: #fff;
}

.container {
  max-width: 420px;
  margin: auto;
  padding: 20px;
}

.header {
  background: #111;
  border-radius: 20px;
  padding: 15px;
  text-align: center;
  margin-top: 20px;
}

h1 {
  font-size: 22px;
}

.card {
  background: #1a1a1a;
  border-radius: 20px;
  padding: 15px;
  margin-top: 20px;
  border-left: 4px solid #2563eb;
}

.step {
  margin: 12px 0;
}

.step span {
  color: #3b82f6;
  font-weight: bold;
}

.btn {
  width: 100%;
  padding: 16px;
  border-radius: 50px;
  border: none;
  margin-top: 20px;
  font-size: 16px;
  background: #333;
  color: #777;
  cursor: not-allowed;
  transition: 0.3s;
}

.btn.active {
  background: linear-gradient(45deg, #2563eb, #3b82f6);
  color: #fff;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(37,99,235,0.6);
}

.footer {
  text-align: center;
  color: #888;
  margin-top: 10px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Área de acesso</h1>
  </div>

  <div class="card">
    <div class="step">1) Toque nos <span>três pontos</span></div>
    <div class="step">2) Selecione <span>"abrir no navegador"</span></div>
    <div class="step">3) O botão será liberado automaticamente</div>
  </div>

  <button id="btn" class="btn">Abra no navegador primeiro</button>
  <div id="msg" class="footer">Necessário abrir no navegador para continuar</div>

</div>

<script>
const btn = document.getElementById("btn");
const msg = document.getElementById("msg");

function isInApp() {
  const ua = navigator.userAgent || '';
  return ua.includes('FBAN') || ua.includes('FBAV') || ua.includes('Instagram') || ua.includes('TikTok');
}

// evento intermediário
setTimeout(() => {
  fbq('track', 'ViewContent');
}, 3000);

if (!isInApp()) {

  setTimeout(() => {
    btn.classList.add("active");
    btn.innerText = "Acessar";

    msg.style.display = "none";

    btn.onclick = () => {
      fbq('track', 'Lead');
      window.location.href = "https://t.me/yasmimsilxa_bot";
    };

  }, 2000);
}
</script>

</body>
</html>
